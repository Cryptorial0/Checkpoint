name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev squashfs-tools file

      - name: Build Windows Executable
        run: |
          mkdir -p dist
          cd src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o ../dist/checkpoint.exe .
          cd ..

      - name: Build Linux ELF Binary
        run: |
          cd src
          go build -ldflags="-s -w" -o ../dist/checkpoint .
          cd ..

      - name: Package Linux AppImage
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp dist/checkpoint AppDir/usr/bin/checkpoint

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/checkpoint" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/checkpoint.desktop
          [Desktop Entry]
          Type=Application
          Name=Checkpoint
          Exec=checkpoint
          Icon=checkpoint
          Categories=Utility;Game;
          Comment=PC Game Save & Emulator Migration Tool
          Terminal=false
          EOF

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/checkpoint.png
            cp assets/icon.png AppDir/.DirIcon
          else
            touch AppDir/checkpoint.png AppDir/.DirIcon
          fi

          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract)
          ARCH=x86_64 /tmp/squashfs-root/AppRun AppDir "dist/checkpoint-${TAG_NAME}.AppImage"

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/checkpoint.exe
            dist/checkpoint
            dist/checkpoint-*.AppImage
            dist/SHA256SUMS.txt
          generate_release_notes: true
