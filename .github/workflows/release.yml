name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Compile Windows Executable
        run: |
          mkdir -p dist
          cd src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o ../dist/checkpoint.exe .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/checkpoint.exe
          retention-days: 1

  build-linux:
    name: Build Linux Binaries & AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev squashfs-tools file

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Compile Linux ELF Binary
        run: |
          mkdir -p dist
          cd src
          go build -ldflags="-s -w" -o ../dist/checkpoint .

      - name: Package Linux AppImage
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp dist/checkpoint AppDir/usr/bin/checkpoint

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/checkpoint" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/checkpoint.desktop
          [Desktop Entry]
          Type=Application
          Name=Checkpoint
          Exec=checkpoint
          Icon=checkpoint
          Categories=Utility;Game;
          Comment=PC Game Save & Emulator Migration Tool
          Terminal=false
          EOF

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/checkpoint.png
            cp assets/icon.png AppDir/.DirIcon
          else
            touch AppDir/checkpoint.png AppDir/.DirIcon
          fi

          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract)
          ARCH=x86_64 /tmp/squashfs-root/AppRun AppDir "dist/checkpoint-${TAG_NAME}.AppImage"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/checkpoint
            dist/checkpoint-*.AppImage
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/checkpoint.exe
            dist/checkpoint
            dist/checkpoint-*.AppImage
            dist/SHA256SUMS.txt
          generate_release_notes: true
