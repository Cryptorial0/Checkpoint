name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Compile Windows Executable
        run: |
          mkdir -p dist
          cd src
          go-winres make --arch amd64 --product-version git-tag --file-version git-tag
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o ../dist/checkpoint.exe .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/checkpoint.exe
          retention-days: 1

  build-linux:
    name: Build Linux Binaries & AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev squashfs-tools file patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Compile Linux ELF Binary
        run: |
          mkdir -p dist
          cd src
          go build -ldflags="-s -w" -o ../dist/checkpoint .

      - name: Package Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp dist/checkpoint AppDir/usr/bin/checkpoint

          cat << 'EOF' > AppDir/checkpoint.desktop
          [Desktop Entry]
          Type=Application
          Name=Checkpoint
          Exec=checkpoint
          Icon=checkpoint
          Categories=Utility;Game;
          Comment=Game Save Backup & Restore Suite
          Terminal=false
          StartupWMClass=checkpoint
          EOF

          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/checkpoint.png
            cp assets/icon.png AppDir/.DirIcon
            cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/checkpoint.png
          else
            touch AppDir/checkpoint.png AppDir/.DirIcon
          fi

          # Bundle WebKit2GTK helper processes (WebKitNetworkProcess, WebKitWebProcess)
          WEBKIT_DIR=$(dirname $(find /usr/lib -name "WebKitNetworkProcess" 2>/dev/null | head -n 1))
          if [ -n "$WEBKIT_DIR" ] && [ -d "$WEBKIT_DIR" ]; then
            mkdir -p AppDir/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
            cp -r "${WEBKIT_DIR}/"* AppDir/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/
            mkdir -p AppDir/usr/libexec/webkit2gtk-4.1
            cp -r "${WEBKIT_DIR}/"* AppDir/usr/libexec/webkit2gtk-4.1/
          fi

          # Download linuxdeploy and GTK plugin
          curl -sL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /tmp/linuxdeploy
          chmod +x /tmp/linuxdeploy

          curl -sL https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -o /tmp/linuxdeploy-plugin-gtk.sh
          chmod +x /tmp/linuxdeploy-plugin-gtk.sh

          # Run linuxdeploy with GTK plugin to bundle WebKit2GTK and GTK runtime dependencies
          export PATH="/tmp:$PATH"
          EXTRA_EXECS=""
          if [ -f "AppDir/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess" ]; then
            EXTRA_EXECS="-e AppDir/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess -e AppDir/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebProcess"
          fi
          /tmp/linuxdeploy --appdir AppDir -e AppDir/usr/bin/checkpoint $EXTRA_EXECS -d AppDir/checkpoint.desktop -i AppDir/checkpoint.png --plugin gtk

          # Replace AppRun with wrapper script ensuring WebKit subprocesses find their bundle
          rm -f AppDir/AppRun
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export APPDIR="$HERE"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export WEBKIT_EXEC_PATH="$HERE/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
          export WEBKIT_INJECTED_BUNDLE_PATH="$HERE/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/injected-bundle"
          export WEBKIT_FORCE_SANDBOX=0
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          exec "$HERE/usr/bin/checkpoint" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Package AppImage with appimagetool
          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract)
          ARCH=x86_64 /tmp/squashfs-root/AppRun AppDir "dist/checkpoint-${TAG_NAME}.AppImage"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/checkpoint
            dist/checkpoint-*.AppImage
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/checkpoint.exe
            dist/checkpoint
            dist/checkpoint-*.AppImage
            dist/SHA256SUMS.txt
          generate_release_notes: true
